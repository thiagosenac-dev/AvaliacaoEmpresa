<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Gestão - Avaliações</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div id="loginScreen">
            <header>
                <img src="assets/logo-digitusul.jpeg" alt="Digitusul" class="logo">
                <h1>Acesso Restrito</h1>
                <p>Faça login para ver as avaliações dos técnicos.</p>
            </header>
            <form id="loginForm">
                <div class="input-group">
                    <label for="username">E-mail:</label>
                    <input type="email" id="username" placeholder="Digite seu e-mail" required>
                </div>
                <div class="input-group">
                    <label for="password">Senha:</label>
                    <input type="password" id="password" placeholder="Digite sua senha" required>
                </div>
                <button type="submit" class="btn-primary">Entrar</button>
            </form>
            <div class="footer-links">
                <a href="index.html">&larr; Voltar para a página de avaliação</a>
            </div>
        </div>

        <div id="dashboardScreen" class="hidden">
            <header>
                <img src="assets/logo-digitusul.jpeg" alt="Digitusul" class="logo">
                <h1>Avaliações Recebidas</h1>
                <button id="logoutBtn" class="btn-secondary">Sair</button>
            </header>
            
            <div class="reviews-list" id="reviewsContainer">
                </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
